<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nirwest Chronicles</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .hero {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          rgba(0,0,0,.25),
          rgba(0,0,0,.75)
        ),
        url("https://img.youtube.com/vi/wFhQjP9k5o4/maxresdefault.jpg")
        center center / cover no-repeat;
    }

    .hero h1 {
      margin: 0;

      font-family: Georgia, serif;
      font-size: clamp(42px, 8vw, 110px);

      text-align: center;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>NIRWEST</h1>
  </section>

</body>
</html>
